services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kpop
      POSTGRES_PASSWORD: kpop
      POSTGRES_DB: kpop_c
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpop -d kpop_c"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://kpop:kpop@postgres:5432/kpop_c
      JWT_SECRET: dev-secret
      NODE_ENV: development
      PUBLIC_BASE_URL: http://localhost:3000
      ADMIN_TOKEN: dev-admin
      OPS_ADMIN_USER: ops
      OPS_ADMIN_PASSWORD: ops-dev
      DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - sharedata:/app/data

volumes:
  pgdata:
  sharedata:
