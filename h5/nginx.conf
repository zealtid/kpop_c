server {
    listen ${PORT} default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Production is https://zealhe.top/h5/ (Vite base `/h5/`, assets at `/h5/assets/...`).
    # Dist files still live at html root; rewrite keeps Railway root-domain deploys working
    # if a reverse proxy forwards `/h5/` without stripping, or if `/` is opened directly.
    location = /h5 {
        return 302 /h5/;
    }

    location /h5/ {
        rewrite ^/h5/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
