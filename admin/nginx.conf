server {
    listen ${PORT} default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Railway healthcheck — do not fall through to SPA HTML only.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: login / catalog / intel / audit client routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
