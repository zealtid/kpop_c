server {
    listen ${PORT} default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Railway healthcheck — do not fall through to SPA HTML only.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Production is https://www.zealhe.top/admin/ (Vite base `/admin/`, assets at `/admin/assets/...`).
    # Dist files still live at html root; rewrite keeps Railway root-domain deploys working
    # if a reverse proxy forwards `/admin/` without stripping, or if `/` is opened directly.
    location = /admin {
        return 302 /admin/;
    }

    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 last;
    }

    # SPA fallback: login / catalog / intel / audit client routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
